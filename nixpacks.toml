[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.mysqli", "php82Extensions.pdo", "php82Extensions.pdo_mysql"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
    "php spark cache:clear",
    "chmod -R 755 writable/"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public/"